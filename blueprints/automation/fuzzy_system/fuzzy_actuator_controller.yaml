blueprint:
  name: "Fuzzy System: Continuous Actuator Controller"
  description: >
    Seamlessly drive physical devices (Fans, Dimmers, or Dampers) from a 
    Fuzzy System output sensor, handling device cutoffs, integer rounding, 
    and unavailable sensor states safely.
  domain: automation
  author: "Doug Ransom"
  source_url: "https://github.com/dougransom/fuzzy_system/blob/main/blueprints/automation/fuzzy_system/fuzzy_actuator_controller.yaml"
  input:
    fuzzy_sensor:
      name: Fuzzy Output Sensor
      description: "The sensor entity generated by Fuzzy System (e.g., sensor.fuzzy_indoor_comfort_fan_speed)."
      selector:
        entity:
          domain: sensor
    target_entity:
      name: Target Actuator Entity
      description: "The physical device to control (Fan or Light dimmer)."
      selector:
        target:
          entity:
            domain:
              - fan
              - light
    cutoff_threshold:
      name: Low Cutoff Threshold
      description: "Below this fuzzy output value, the target device is completely turned off (0-100 scale)."
      default: 2.0
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: "%"
    min_on_speed:
      name: Minimum On Speed / Brightness
      description: "When turned on, the minimum percentage to send to the device to prevent motor stall or bulb flicker."
      default: 10
      selector:
        number:
          min: 5
          max: 50
          step: 1
          unit_of_measurement: "%"

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input fuzzy_sensor

condition:
  # Guard against unavailable, unknown, or non-numeric boot states
  - condition: template
    value_template: >
      {{ trigger.to_state.state not in ['unknown', 'unavailable'] and trigger.to_state.state | float(none) is not none }}

variables:
  cutoff: !input cutoff_threshold
  min_speed: !input min_on_speed
  raw_value: "{{ trigger.to_state.state | float(0) }}"
  target: !input target_entity

action:
  - choose:
      # If fuzzy value is below cutoff, turn device OFF
      - conditions:
          - condition: template
            value_template: "{{ raw_value <= cutoff }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ 'fan' in target.entity_id or 'fan' in (target.get('entity_id') | string) }}"
                sequence:
                  - service: fan.turn_off
                    target: !input target_entity
            default:
              - service: homeassistant.turn_off
                target: !input target_entity

    # Otherwise, turn device ON and set percentage (clamped to min_on_speed)
    default:
      - variables:
          clamped_pct: "{{ [raw_value, min_speed] | max | round(0) | int }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ 'fan' in target.entity_id or 'fan' in (target.get('entity_id') | string) }}"
            sequence:
              - service: fan.set_percentage
                target: !input target_entity
                data:
                  percentage: "{{ clamped_pct }}"
        default:
          - service: light.turn_on
            target: !input target_entity
            data:
              brightness_pct: "{{ clamped_pct }}"

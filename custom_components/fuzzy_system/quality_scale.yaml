rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Helper integration calculates values reactively via input entity state change events without polling.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: Integration does not implement custom automation conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not implement custom automation triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Local calculated helper does not communicate with external devices or services during configuration.
  test-before-setup:
    status: exempt
    comment: Local calculated helper does not communicate with external devices or services during setup.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Helper integration does not require authentication credentials.
  test-coverage: done

  # Gold
  devices:
    status: exempt
    comment: Helper integration operates as virtual sensor entities rather than physical hardware devices.
  diagnostics: done
  discovery:
    status: exempt
    comment: Helper integration is configured via UI or YAML; network discovery is not applicable.
  discovery-update-info:
    status: exempt
    comment: Discovery is not applicable to local helper integration.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Helper integration does not interface with specific hardware devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: No physical devices to dynamically discover or attach.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: No devices registered to clean up.

  # Platinum
  async-dependency:
    status: exempt
    comment: scikit-fuzzy runs pure mathematical computations in memory without blocking I/O.
  inject-websession:
    status: exempt
    comment: Helper integration does not perform outbound HTTP network requests.
  strict-typing:
    status: todo
    comment: Full strict typing validation under HA core mypy checks.

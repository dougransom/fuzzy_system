name: Validate Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio pytest-homeassistant-custom-component scikit-fuzzy numpy scipy

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest with Quality Scale Coverage Enforcement (>=95%)
        run: pytest tests --cov=custom_components.fuzzy_system --cov-fail-under=95

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
